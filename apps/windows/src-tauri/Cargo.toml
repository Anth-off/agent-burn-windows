[package]
name = "agent-burn-windows"
version = "0.1.0"
description = "Agent Burn desktop for Windows"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace]

[lib]
name = "agent_burn_windows"
crate-type = ["rlib"]

[[bin]]
name = "agent-burn-windows"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
