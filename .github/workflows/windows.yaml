name: Windows app

on:
  push:
    paths:
      - 'apps/windows/**'
      - 'rust/**'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/windows.yaml'
  pull_request:
    paths:
      - 'apps/windows/**'
      - 'rust/**'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/windows.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      TZ: UTC
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.21.1
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.1.1
      - name: Install pinned Rust toolchain
        run: |
          $toolchainFile = Get-Content -LiteralPath rust-toolchain.toml -Raw
          $toolchainMatch = [regex]::Match($toolchainFile, '(?m)^channel\s*=\s*"([^"]+)"')
          if (-not $toolchainMatch.Success) { throw 'Rust toolchain channel is missing.' }
          rustup toolchain install $toolchainMatch.Groups[1].Value --profile minimal --component rustfmt --component clippy
      - name: Install Windows workspace dependencies
        run: pnpm install --filter @agent-burn/windows... --frozen-lockfile
      - name: Create default Claude directories for CLI tests
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE/.claude/projects", "$env:USERPROFILE/.config/claude/projects" | Out-Null
      - name: Test Rust CLI
        run: cargo test --manifest-path rust/Cargo.toml --workspace --locked
      - name: Test CLI launcher and pricing tooling
        run: node --test apps/agent-burn/src/cli.test.ts nix/models-dev-compact.test.ts
      - name: Test dashboard and native packaging scripts
        run: pnpm --dir apps/windows test
      - name: Type-check dashboard
        run: pnpm --dir apps/windows typecheck
      - name: Lint dashboard
        run: pnpm --dir apps/windows lint
      - name: Check dashboard formatting
        run: pnpm --dir apps/windows format:check
      - name: Build dashboard
        run: pnpm --dir apps/windows build
      - name: Build and stage bundled native CLI
        run: pnpm --dir apps/windows native:prepare
      - name: Check Windows backend formatting
        run: cargo fmt --manifest-path apps/windows/src-tauri/Cargo.toml -- --check
      - name: Test Windows backend
        run: cargo test --manifest-path apps/windows/src-tauri/Cargo.toml --locked
      - name: Lint Windows backend
        run: cargo clippy --manifest-path apps/windows/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build NSIS installer
        run: pnpm --dir apps/windows desktop:build --bundles nsis
      - name: Compute installer checksums
        run: |
          $installers = @(Get-ChildItem -LiteralPath apps/windows/src-tauri/target/release/bundle/nsis -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'No Windows installer was produced.' }
          foreach ($installer in $installers) {
            $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath ($installer.FullName + '.sha256') -Value ($checksum + '  ' + $installer.Name) -Encoding ascii
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-burn-windows-x64
          path: |
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe.sha256
          if-no-files-found: error
          retention-days: 14
